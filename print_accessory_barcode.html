<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>طباعة باركود الإكسسوار — طلال للاتصالات</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Firebase so we can read the accessory back -->
  <script type="module" src="js/firebase-config-cdn.js?v=20260619-firestore-phone-save-v4"></script>
  <script type="module" src="js/firebase-database-cdn.js?v=20260619-firestore-phone-save-v4"></script>
  <script type="module" src="js/firebase-storage-manager.js?v=20260619-firestore-phone-save-v4"></script>

  <style>
    :root { --card-bg:#fff; --muted:#cfcfcf; }
    body { font-family:'Cairo',sans-serif; background:#f8f9fa; margin:0; padding:24px; }
    .container { max-width:900px; margin:0 auto; }
    .card { background:var(--card-bg); border:1px solid #e5e7eb; border-radius:12px; box-shadow:0 10px 20px rgba(0,0,0,.05); }
    .card-header { padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; justify-content:space-between; }
    .card-header h3 { margin:0; font-size:1.1rem; font-weight:700; }
    .card-body { padding:20px; }
    .sticker-preview{ border:2px dashed var(--muted); padding:20px; background:#f9f9f9; border-radius:10px; display:flex; justify-content:center; margin-bottom:18px; }

    /* مقاس الملصق ونظام التخطيط مطابقان حرفياً لصفحة باركود الهاتف */
    .sticker{ width:40mm; height:25mm; background:#fff; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; padding:2.15mm 3.4mm 1.15mm; color:#000; }
    .shop{ flex:0 0 auto; text-align:center; font-weight:900; font-size:3.75mm; line-height:0.95; white-space:nowrap; margin:0 0 0.9mm; }
    .sticker-barcode{ flex:0 0 auto; height:6.35mm; display:flex; align-items:stretch; justify-content:center; margin:0 0 0.85mm; }
    .sticker-barcode canvas{ width:100%; height:100%; image-rendering:crisp-edges; image-rendering:pixelated; display:block; }
    .rows{ flex:0 0 auto; display:flex; flex-direction:row; gap:0.5mm; justify-content:space-between; align-items:flex-start; margin:0; }
    .row2{ display:flex; flex:1 1 0; min-width:0; flex-direction:column; align-items:center; text-align:center; line-height:1; }
    .label{ color:#111; font-weight:900; font-size:1.85mm; line-height:1; text-align:center; white-space:nowrap; margin-bottom:0.5mm; }
    .value{ color:#000; font-weight:900; font-size:3.25mm; line-height:0.95; text-align:center; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
    #accessory-name{ min-width:0; }

    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{ appearance:none; border:0; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; font-family:inherit; }
    .btn-primary{ background:#10b981; color:#fff; }
    .btn-outline{ background:#fff; color:#111; border:1px solid #e5e7eb; }
    .btn i{ margin-left:8px; }
    @page{ size:auto; margin:5mm; }
    @media print{ .no-print{ display:none !important; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h3>طباعة باركود الإكسسوار</h3>
        <div class="actions no-print">
          <button id="btnDownloadPDF" class="btn btn-primary">تحميل PDF <i class="fa fa-download"></i></button>
          <button id="btnPrintPDF" class="btn btn-outline">طباعة PDF <i class="fa fa-print"></i></button>
          <a href="dashboard.html" class="btn btn-outline">العودة للوحة التحكم</a>
        </div>
      </div>
      <div class="card-body">
        <div class="sticker-preview">
          <div id="sticker" class="sticker">
            <div class="shop">طلال للاتصالات</div>
            <div class="sticker-barcode"><canvas id="barcode-canvas"></canvas></div>
            <div class="rows">
              <div class="row2">
                <div class="label">السعر</div>
                <div class="value" id="selling-price">جاري التحميل...</div>
              </div>
            </div>
          </div><!-- /sticker -->
          <!-- الاسم محفوظ داخلياً لاسم ملف PDF دون عرضه على الملصق -->
          <span id="accessory-name" hidden></span>
        </div><!-- /preview -->
      </div>
    </div>
  </div>

<script>
(function(){
  // مقاس الإخراج — مطابق لصفحة باركود الهاتف
  const STICKER_MM = { w:40, h:25 }, DPI = 300, PX_PER_MM = DPI/25.4;
  const TARGET_W = Math.round(STICKER_MM.w * PX_PER_MM);
  const TARGET_H = Math.round(STICKER_MM.h * PX_PER_MM);

  const ARABIC_DIGITS = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9' };
  function normalizeCode(value){
    return String(value == null ? '' : value).replace(/[٠-٩]/g, d => ARABIC_DIGITS[d] || d).trim();
  }

  // معرّف رقمي (7 أرقام يبدأ بـ 9) يُشفّر في CODE128 على ملصق 40×25mm لسهولة القراءة.
  // نفس الدالة مستخدمة في add_accessory.html و create_sale.html لضمان تطابق المسح.
  // legacy=true يعيد صيغة ACXXXXXX القديمة (8 رموز) للمطابقة مع الملصقات القديمة فقط.
  function shortAccessoryCode(value, legacy){
    const str = normalizeCode(value);
    let h = 0x811c9dc5;
    for(let i=0;i<str.length;i++){
      h = Math.imul(h ^ str.charCodeAt(i), 0x01000193) >>> 0;
      h = (h + Math.imul(i + 1, 0x85ebca6b)) >>> 0;
    }
    if(legacy) return 'AC' + h.toString(36).toUpperCase().padStart(6,'0').slice(-6);
    return '9' + String(h % 1000000).padStart(6,'0');
  }
  function isShortCode(value){
    return /^[A-Za-z0-9]{6,8}$/.test(normalizeCode(value));
  }

  // يقبل المعرّف القصير الجديد، والباركود المرجعي القديم ACC-YYYYMMDD-0001،
  // والمعرّف المختصر المشتق من سجل قديم لم يُحدَّث بعد.
  function matchesBarcode(record, code, strict){
    const c = normalizeCode(code);
    if(!c || !record) return false;
    const fields = [record.barcode, record.barcode_id, record.sku, record.accessory_number];
    return fields.some(v => {
      if(v == null) return false;
      const s = normalizeCode(v);
      const flat = s.replace(/[^a-zA-Z0-9]/g, '');
      return s === c || flat === c ||
        (!strict && isShortCode(c) &&
          (shortAccessoryCode(s) === c || shortAccessoryCode(s, true) === c));
    });
  }
  // تطابق الحقول المخزنة أولاً؛ المشتقات تستخدم فقط كحل أخير لتجنب اختيار سجل خاطئ عند تصادم الأرقام
  function findBestAccessory(list, code){
    const rows = Array.isArray(list) ? list : Object.values(list || {});
    return rows.find(a => matchesBarcode(a, code, true)) ||
           rows.find(a => matchesBarcode(a, code)) || null;
  }

  const stickerEl = document.getElementById('sticker');
  const btnDownload = document.getElementById('btnDownloadPDF');
  const btnPrint = document.getElementById('btnPrintPDF');
  let currentBarcode = '';

  function generateBarcode(code){
    const canvas = document.getElementById('barcode-canvas');
    if(!canvas || !window.JsBarcode) return;
    const options = {
      format:"CODE128",
      width:3,
      height:70,
      displayValue:false,
      background:"#ffffff",
      lineColor:"#000000",
      margin:2
    };
    let value = normalizeCode(code) || '-';
    try{
      JsBarcode(canvas, value, options);
    }catch(error){
      // أي قيمة غير صالحة لـ CODE128 تُحوَّل إلى معرّف قصير بدل تشويه الرسم أو كسر الصفحة
      console.warn('JsBarcode failed, using short fallback:', error);
      value = shortAccessoryCode(value);
      JsBarcode(canvas, value, options);
    }
    currentBarcode = value;
  }

  async function captureStickerCanvas(){
    // عنصر الملصق himself بنسبة 40:25، لذلك scaleX === scaleY ولا يحدث stretch عند addImage
    const scaleX = TARGET_W / stickerEl.clientWidth;
    const scaleY = TARGET_H / stickerEl.clientHeight;
    const scale = Math.min(scaleX, scaleY);
    return await html2canvas(stickerEl, {
      backgroundColor:'#ffffff',
      scale,
      useCORS:true,
      logging:false,
      x:0, y:0,
      width: stickerEl.clientWidth,
      height: stickerEl.clientHeight
    });
  }

  async function downloadPdf(){
    const canvas = await captureStickerCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:[STICKER_MM.w, STICKER_MM.h] });
    doc.addImage(imgData, 'PNG', 0, 0, STICKER_MM.w, STICKER_MM.h, undefined, 'FAST');
    const accessoryName = document.getElementById('accessory-name').textContent || 'accessory';
    doc.save(`barcode_${accessoryName.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
  }

  async function printPdf(){
    const canvas = await captureStickerCanvas();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:[STICKER_MM.w, STICKER_MM.h] });
    doc.addImage(imgData, 'PNG', 0, 0, STICKER_MM.w, STICKER_MM.h, undefined, 'FAST');
    const blobUrl = doc.output('bloburl');
    const win = window.open(blobUrl);
    if(!win){ alert('يرجى السماح بفتح النوافذ المنبثقة للطباعة.'); return; }
    const onLoad = ()=>{ win.focus(); win.print(); };
    if(win.document.readyState==='complete'){ onLoad(); } else { win.onload = onLoad; }
  }

  function valuesFromAccessory(accessory){
    const name = accessory?.name || accessory?.arabic_name || 'غير محدد';
    const price = accessory?.selling_price || 0;
    const priceText = price ? `${price} ريال` : '-';
    return { name, priceText };
  }

  // القيمة التي تُشفَّر فعلياً: المعرّف القصير المخزَّن، أو مشتق منه للسجلات القديمة
  function encodeValueFor(accessory, passed){
    if(accessory && isShortCode(accessory.barcode_id)) return normalizeCode(accessory.barcode_id);
    const reference = normalizeCode(accessory?.barcode || accessory?.barcode_id || passed);
    if(isShortCode(reference)) return reference;
    return shortAccessoryCode(reference || 'ACC');
  }

  function fillSticker({name, priceText}){
    document.getElementById('accessory-name').textContent = name || '-';
    document.getElementById('selling-price').textContent = priceText || '-';
    generateBarcode(currentBarcode || '-');
  }

  async function findAccessoryByBarcode(barcode){
    if(!barcode) return null;

    // 1) Fast handoff from add page
    try{
      const last = JSON.parse(localStorage.getItem('lastAddedAccessory')||'null');
      if(matchesBarcode(last, barcode, true)) return last;
    }catch{}

    // 2) Firebase (if available)
    try{
      if(window.storage && window.storage.isFirebaseAvailable){
        if(typeof window.storage.getAccessoryByBarcode === 'function'){
          const one = await window.storage.getAccessoryByBarcode(String(barcode));
          if(one) return one;
        }
        const all = await window.storage.getAccessories();
        if(all){
          const found = findBestAccessory(all, barcode);
          if(found) return found;
        }
      }
    }catch(e){ console.warn('Firebase lookup failed:', e); }

    // 3) LocalStorage fallback
    try{
      const arr = JSON.parse(localStorage.getItem('accessories')||'[]');
      const found = findBestAccessory(arr, barcode);
      if(found) return found;
    }catch{}

    return null;
  }

  async function loadAccessoryData(){
    // allow Firebase modules to initialize
    await new Promise(r => setTimeout(r, 300));

    const urlParams = new URLSearchParams(window.location.search);
    const barcode = urlParams.get('barcode');
    const ref = urlParams.get('ref');

    if(barcode){
      const accessory = await findAccessoryByBarcode(barcode);
      currentBarcode = encodeValueFor(accessory, ref || barcode);
      if(accessory){
        fillSticker(valuesFromAccessory(accessory));
        return;
      }
      // لا سجل مطابق: نطبع معرّفاً قصيراً صالحاً للمسح دون تشويه CODE128
      fillSticker({ name: 'إكسسوار غير محدد', priceText: '-' });
      console.warn('Accessory not found; printed short code:', currentBarcode);
      return;
    }

    // No ?barcode= : try lastAddedAccessory directly
    try{
      const last = JSON.parse(localStorage.getItem('lastAddedAccessory')||'null');
      if(last){
        currentBarcode = encodeValueFor(last, last.barcode || last.barcode_id);
        fillSticker(valuesFromAccessory(last));
        return;
      }
    }catch{}

    // Finally, generate a short label if nothing provided; keep the long reference as internal data
    const today = new Date();
    const dateStr = today.getFullYear().toString() +
                    String(today.getMonth()+1).padStart(2,'0') +
                    String(today.getDate()).padStart(2,'0');
    const key = `lastAccessorySerial_${dateStr}`;
    const next = (parseInt(localStorage.getItem(key)||'0', 10) + 1);
    localStorage.setItem(key, String(next));
    const reference = `ACC-${dateStr}-${String(next).padStart(4,'0')}`;
    currentBarcode = shortAccessoryCode(reference + Date.now() + Math.random());
    fillSticker({ name: 'إكسسوار جديد', priceText: '0 ريال' });
    console.info('Accessory reference (internal):', reference, '| short code:', currentBarcode);
  }

  document.addEventListener('DOMContentLoaded', loadAccessoryData);
  btnDownload?.addEventListener('click', (e)=>{ e.preventDefault(); downloadPdf(); });
  btnPrint?.addEventListener('click', (e)=>{ e.preventDefault(); printPdf(); });
})();
</script>
</body>
</html>
